packages:
  - apps/*
  - packages/*

nodeLinker: isolated
linkWorkspacePackages: false
saveExact: true
engineStrict: true
strictPeerDependencies: true
packageManagerStrictVersion: true
managePackageManagerVersions: false
updateNotifier: false
storeDir: .pnpm-store
cacheDir: .cache/pnpm
# P1.1 installs build-time packages only; no lifecycle/native/Electron download scripts.
allowBuilds: {}
