packages:
  - apps/*
  - packages/*

nodeLinker: isolated
linkWorkspacePackages: false
saveExact: true
engineStrict: true
strictPeerDependencies: true
packageManagerStrictVersion: true
managePackageManagerVersions: false
updateNotifier: false
storeDir: .pnpm-store
cacheDir: .cache/pnpm
# Lifecycle scripts remain disabled. P1.2 uses package-pinned Node-API prebuilds;
# prepare:electron explicitly verifies and extracts the official Electron archive.
allowBuilds: {}
