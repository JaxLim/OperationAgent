name: P0 frozen engineering replay

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    name: P0 metadata (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      XDG_DATA_HOME: ${{ github.workspace }}/.cache/data
      XDG_STATE_HOME: ${{ github.workspace }}/.cache/state
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 04d07bea89b70265a6b1fb1d79272b710623775b
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Runtime identity
        run: node -e "console.log(JSON.stringify({node:process.version,platform:process.platform,arch:process.arch,abi:process.versions.modules}))"
      - name: Install verified workspace-local pnpm
        run: node scripts/bootstrap-windows.mjs --pnpm-only
      - run: node .tools/pnpm/bin/pnpm.cjs install --frozen-lockfile --ignore-scripts
      - run: node .tools/pnpm/bin/pnpm.cjs check
      - run: node .tools/pnpm/bin/pnpm.cjs check:p0-exit
      - name: Compiled P0 checker
        run: node dist/tooling/scripts/p0-check.js
      - name: Scope reminder
        run: node -e "console.log('P0 metadata checks only. No application, ABI loading, OS isolation, installer or P1 tests have run.')"
