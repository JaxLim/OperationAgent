name: P1 control plane checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: P1 engineering and scoped process gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      XDG_DATA_HOME: ${{ github.workspace }}/.cache/data
      XDG_STATE_HOME: ${{ github.workspace }}/.cache/state
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - if: runner.os == 'Windows'
        run: node scripts/bootstrap-windows.mjs
      - if: runner.os != 'Windows'
        run: node scripts/bootstrap-windows.mjs --pnpm-only
      - run: node .tools/pnpm/bin/pnpm.cjs install --frozen-lockfile --ignore-scripts
      - name: Windows x64 real Electron and Node process acceptance
        if: runner.os == 'Windows'
        run: node .tools/pnpm/bin/pnpm.cjs check:p1
      - name: Windows x64 installer build (P1.6)
        if: runner.os == 'Windows' && !cancelled()
        run: node .tools/pnpm/bin/pnpm.cjs package
      - name: Windows x64 installed-application smoke (SEC-18)
        if: runner.os == 'Windows' && !cancelled()
        run: node .tools/pnpm/bin/pnpm.cjs test:smoke
      - name: Preserve the Windows installer
        if: runner.os == 'Windows' && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operationagent-installer-win-x64
          path: |
            dist/installers/*.exe
            dist/installers/*.blockmap
          retention-days: 14
      - name: Other platforms engineering checks (process integration NOT_RUN)
        if: runner.os != 'Windows'
        run: node .tools/pnpm/bin/pnpm.cjs check:engineering
      - name: Preserve command output and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p1-evidence-${{ matrix.os }}
          path: artifacts/p1/
          retention-days: 14
      - name: Scope reminder
        run: node -e "console.log('Process, restricted Worker fixture (P1.4/P1.5) and installer acceptance target Windows x64 only. Other OS process integration, Worker fixture and installer smoke remain NOT_RUN.')"
